name: Soroban Contracts CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/contracts/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/contracts/**'
      - '.github/workflows/contracts.yml'

jobs:
  test-and-build:
    name: Test & Build Contracts
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          targets: wasm32-unknown-unknown,wasm32v1-none

      - name: Ensure wasm32v1-none target is available
        run: rustup target add wasm32v1-none

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Cargo Registry & Git Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('packages/contracts/*/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Contract Build Artifacts
        uses: actions/cache@v4
        with:
          path: packages/contracts/target
          key: ${{ runner.os }}-contracts-target-rust1.92.0-stellar23.4.1-${{ hashFiles('packages/contracts/*/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-contracts-target-rust1.92.0-stellar23.4.1-${{ hashFiles('packages/contracts/*/Cargo.toml') }}-

      - name: Install Stellar CLI
        run: |
          STELLAR_VERSION="23.4.1"
          STELLAR_URL="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_VERSION}/stellar-cli-${STELLAR_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL --fail --retry 3 -o stellar-cli.tar.gz "$STELLAR_URL"
          tar -xzf stellar-cli.tar.gz
          sudo mv stellar /usr/local/bin/
          stellar --version

      - name: Build contract WASMs needed by integration tests
        run: |
          cd packages/contracts
          rm -f target/wasm32-unknown-unknown/release/prediction_market*.wasm
          rm -f target/wasm32-unknown-unknown/release/outcome_manager*.wasm
          rm -f target/wasm32v1-none/release/prediction_market*.wasm
          rm -f target/wasm32v1-none/release/outcome_manager*.wasm
          cd prediction_market
          stellar contract build
          cd ../outcome_manager
          stellar contract build
          ls -la ../target/wasm32v1-none/release/prediction_market*.wasm
          ls -la ../target/wasm32v1-none/release/outcome_manager*.wasm

      - name: Run Cargo Test (debug, x86_64)
        run: |
          cd packages/contracts
          cargo test --workspace

      - name: Build All Contracts with Stellar CLI (release, wasm)
        run: |
          cd packages/contracts
          stellar contract build

      - name: Check WASM size limit
        run: |
          cd packages/contracts
          bash scripts/build-optimized.sh --check

      - name: Report sccache Stats
        run: sccache --show-stats

      - name: Report Contract Sizes
        run: |
          echo "### Compiled Soroban WASM Sizes" >> $GITHUB_STEP_SUMMARY
          echo "| Contract WASM | Size (KB) |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          for dir in packages/contracts/target/wasm32v1-none/release packages/contracts/target/wasm32-unknown-unknown/release; do
            if [ -d "$dir" ]; then
              for f in "$dir"/*.wasm; do
                [ -e "$f" ] || continue
                sz=$(du -h "$f" | cut -f1)
                name=$(basename "$f")
                echo "| $name | $sz |" >> $GITHUB_STEP_SUMMARY
                echo "WASM: $name Size: $sz"
              done
            fi
          done

      - name: Upload WASM Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-contracts-wasm
          path: |
            packages/contracts/target/wasm32v1-none/release/*.wasm
            packages/contracts/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7
